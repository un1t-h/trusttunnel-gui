name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка и тесты
        shell: powershell
        run: .\build.ps1 -Test

      - uses: actions/upload-artifact@v4
        with:
          name: TrustTunnelGUI
          path: bin/TrustTunnelGUI.exe

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/TrustTunnelGUI.exe
          generate_release_notes: true
